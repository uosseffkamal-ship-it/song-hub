<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية</title>
    
    <style>
        /* --- التنسيقات العامة --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #08080a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- قسم الشعار والاسم المتحرك --- */
        .hero-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .hero-logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
            object-fit: cover;
            animation: pulseGlow 2s infinite alternate ease-in-out;
        }

        .hero-title {
            color: #00ff66;
            font-size: 32px;
            font-weight: bold;
            margin-top: 15px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.8);
            animation: floatText 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
            }
            100% {
                transform: scale(1.06);
                box-shadow: 0 0 30px rgba(0, 255, 102, 0.9);
            }
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* --- الكروت والأزرار --- */
        .card {
            background: #0f1115;
            border: 1px dashed #00ff66;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }

        .card-title {
            position: absolute;
            top: -14px;
            right: 20px;
            background: #00ff66;
            color: #000;
            padding: 3px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .card-content h3 {
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            border: none;
            flex: 1;
            transition: 0.2s;
        }

        .btn-green {
            background: #00ff66;
            color: #000;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #00ff66;
            color: #00ff66;
        }

        .btn-full {
            width: 100%;
            display: block;
        }

        /* --- أزرار التواصل --- */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            text-decoration: none;
        }

        .btn-discord { background-color: #5865F2; }
        .btn-youtube { background-color: #FF0000; }
        .btn-tiktok { background-color: #000000; border: 1px solid #333; }

        .footer-credits {
            text-align: center;
            margin-top: 25px;
            color: #fff;
            font-size: 14px;
        }

        .footer-credits span {
            color: #00ff66;
            font-weight: bold;
        }

        /* --- النافذة المنبثقة --- */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #121214;
            color: #fff;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 380px;
            border: 1px solid #2a2a30;
        }

        .modal-icon { font-size: 45px; margin-bottom: 10px; }
        .modal-text { font-size: 15px; margin-bottom: 20px; color: #ddd; }
        .btn-dark { background: #1f2128; color: #fff; }
        .btn-blue { background: #1d4ed8; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="hero-section">
            <img src="logo.png" alt="Logo.png" class="hero-logo">
            <h1 class="hero-title">𓆩𝙎𝙤𝙣𝙜𓆪</h1>
            <p style="color: #00ff66; border: 1px solid #00ff66; padding: 8px 15px; border-radius: 20px; margin-top: 10px; font-size: 14px;">
       افضل موقع لتنزيل الهاكات☝🏻</p>
        </div>

        <div class="card">
            <div class="card-title">قسم الجوال</div>
            <div class="card-content">
                <h3>اختر نظام تشغيل جهازك</h3>
                <div class="btn-group">
                    <a href="javascript:void(0)" class="btn btn-green" onclick="openModal('https://www.mediafire.com/file/w7at2eayr9xag79/Delta-2.735.1138.apk/file')">أندرويد</a>
                    <a href="javascript:void(0)" class="btn btn-outline" onclick="openModal('https://www.mediafire.com/file/meh0olvkx7ilb3w/Delta-2.733.988.ipa/file')">آيفون</a>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">قسم الكمبيوتر</div>
            <div class="card-content">
                <h3>نظام ويندوز</h3>
                <a href="javascript:void(0)" class="btn btn-green btn-full" onclick="openModal('https://www.mediafire.com/file/4lx52in6um95vmz/Wave.zip/file')">تنزيل للكمبيوتر</a>
            </div>
        </div>

        <div class="social-links">
            <a href="https://discord.gg/UZB8RpD9d" target="_blank" class="btn-social btn-discord">سيرفر الديسكورد</a>
            <a href="https://www.youtube.com/@SongV7" target="_blank" class="btn-social btn-youtube">قناة اليوتيوب</a>
            <a href="https://www.tiktok.com/@youssefkamal0497?_r=1&_t=ZS-98G6aopuHEl" target="_blank" class="btn-social btn-tiktok">حساب التيك توك</a>
        </div>

        <div class="footer-credits">
            Developed by <span>alimohmed / krov</span>
        </div>

    </div>

    <div id="myModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">📺</div>
            <p class="modal-text">إذا ما تعرف كيف تتخطي الروابط اختار من القوائم الي تحت 👇</p>
            
            <button type="button" class="btn btn-dark btn-full" onclick="goToTasksPage()">لا أنا اعرف كيف اتخطي الروابط</button>
            
            <a href="https://youtube.com" target="_blank" class="btn btn-blue btn-full" style="text-decoration:none; text-align:center; display:block; margin-top:10px;">ابي شرح</a>
        </div>
    </div>

    <script>
        let selectedDownloadUrl = "";

        function openModal(downloadUrl) {
            selectedDownloadUrl = downloadUrl;
            let modal = document.getElementById("myModal");
            if (modal) {
                modal.style.display = "flex";
            }
        }

        function goToTasksPage() {
            let finalUrl = selectedDownloadUrl;
            if (!finalUrl || finalUrl.includes("example")) {
                finalUrl = "https://google.com"; 
            }
            
            window.location.href = "tasks.html?download=" + encodeURIComponent(finalUrl);
        }

        window.onclick = function(event) {
            let modal = document.getElementById("myModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };
    </script>
    <audio id="clickSound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" type="audio/mpeg">
</audio>
<script>
    // تشغيل الصوت تلقائياً لكل الأزرار في الصفحة
    document.addEventListener("DOMContentLoaded", function () {
        const sound = document.getElementById("clickSound");

        document.querySelectorAll("a, button, .btn").forEach(button => {
            button.addEventListener("click", function () {
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(e => console.log(e));
                }
            });
        });
    });
</script>
