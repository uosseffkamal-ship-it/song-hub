<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام المهام للوصول للرابط</title>
    <link rel="stylesheet" href="tasks-style.css">
</head>
<body>

    <div class="task-card">
        <div class="task-header">
            <div class="preview-box">
              <img src="banner.png" alt="صورة توضيحية" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;">

            </div>
            <h2>لازم تعمل اشتراك في القناة ولايك وكومنت لكي تحصل على الرابط</h2>
        </div>

        <div class="task-list">
            <a href="https://www.youtube.com/@SongV7" target="_blank" class="task-item" onclick="completeTask(this)">
                <div class="task-info">
                    <strong>Subscribe to channel</strong>
                    <span>اضغط هنا للاشتراك في القناة</span>
                </div>
              <div class="bell-box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="bell-icon">
        <path d="M12 22a2.98 2.98 0 0 0 2.818-2H9.182A2.98 2.98 0 0 0 12 22zm7-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C8.63 5.36 7 7.92 7 11v5l-2 2v1h14v-1l-2-2z"/>
    </svg>
</div>

            </a>

            <a href="https://youtu.be/YECoPSV7TBQ?si=ZPYLdxRfc3ks0NNF" target="_blank" class="task-item" onclick="completeTask(this)">
                <div class="task-info">
                    <strong>Like the video</strong>
                    <span>اعمل لايك على المقطع</span>
                </div>
                <div class="task-badge">👍</div>
            </a>

            <a href="https://discord.gg/YhXdgCEZw" target="_blank" class="task-item" onclick="completeTask(this)">
                <div class="task-info">
                    <strong>Join Discord Server</strong>
                    <span>انضم لسيرفر الديسكورد</span>
                </div>
                <div class="task-badge">💬</div>
            </a>
        </div>

        <button id="verifyBtn" class="btn-verify disabled" onclick="checkFinalStep()" disabled>
            التحقق من إتمام المهام
        </button>

        <div class="progress-box">
            <span>عدد المهام المتمة</span>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div id="counterText" class="counter-text">0/3</div>
        </div>
    </div>

    <script src="tasks-script.js"></script>
</body>
</html>
<style>
/* إطار الصورة المضيء والمرتفع */
.preview-box {
    width: 100% !important;
    height: 200px !important; /* زيادة الارتفاع لتبان الصورة كاملة بوضوح */
    border-radius: 16px !important;
    overflow: hidden !important;
    border: 2px solid #00ff66 !important;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.5) !important;
    animation: pulseBorder 3s infinite alternate ease-in-out !important;
}

/* حركة التكبير والتصغير المباشرة للصورة */
.preview-box img {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important; /* إظهار كامل أبعاد الصورة بدون قص */
    background-color: #000;
    animation: zoomImage 5s infinite alternate ease-in-out !important;
}

/* تغيير ألوان الإطار بنمط النيون */
@keyframes pulseBorder {
    0% {
        border-color: #00ff66;
        box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }
    50% {
        border-color: #ff0055;
        box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
    }
    100% {
        border-color: #00e5ff;
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
    }
}

/* حركة زوم خفيفة للصورة */
@keyframes zoomImage {
    0% { transform: scale(1); }
    100% { transform: scale(1.06); }
}
</style>
